profile:
  show: true
  order: 1
  title: Профиль
  description: |
    Сетевой инженер с опытом работы с сетевыми протоколами и Linux-инфраструктурой. Настраиваю и диагностирую маршрутизацию 
    на базе BGP, OSPF, VLAN, IPsec, GRE, DHCP. Работаю с FRR, keepalived. Пишу скрипты на Python/Bash для автоматизации 
    сетевых задач. Веду техническую документацию. Есть опыт работы с оборудованием Cisco/Huawei, работала с системами мониторинга Zabbix/Grafana.
